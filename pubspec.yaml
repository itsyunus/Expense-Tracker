name: expense_tracker
description: A beautiful expense tracking app for university students with offline-first architecture.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Navigation
  go_router: ^14.6.2

  # Charts
  fl_chart: ^0.69.2

  # Animations
  lottie: ^3.1.3
  # flutter_animate: ^4.5.2

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Security (disabled for web - uncomment for mobile builds)
  # local_auth: ^2.3.0

  # Export (some features disabled for web - uncomment for mobile builds)
  csv: ^6.0.0
  # pdf: ^3.11.1
  # path_provider: ^2.1.5
  # share_plus: ^10.1.3

  # Utils
  intl: ^0.20.1
  uuid: ^4.5.1
  equatable: ^2.0.7

  # Splash Screen
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#6366F1"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  android_12:
    color: "#6366F1"
    image: assets/images/splash_logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/
